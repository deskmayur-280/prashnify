[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uvicorn server:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 75 --ws-ping-interval 15 --ws-ping-timeout 25 --workers 1"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
