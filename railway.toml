[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# FIXED: Bug 5 — removed startCommand (Dockerfile CMD is the single source of truth)
# FIXED: Bug 4 — healthcheckPath changed to /ping (instant, no DB call)
region = "ap-southeast-1"  # Singapore — closest to India
healthcheckPath = "/ping"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
